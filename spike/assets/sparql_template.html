<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims Engine — carbon SPARQL workbench</title>
<style>
  :root {
    --surface-1: #fcfcfb;
    --surface-2: #f0efec;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a8983;
    --accent: #2a78d6;
    --error: #d03b3b;
    --ok: #0ca30c;
    --panel-border: #e3e2dd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1a1a19;
      --surface-2: #383835;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8a8983;
      --accent: #3987e5;
      --error: #e46c6c;
      --ok: #3fbf3f;
      --panel-border: #33322f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; background: var(--surface-1);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { padding: 14px 18px 10px; border-bottom: 1px solid var(--panel-border); }
  header h1 { margin: 0; font-size: 16px; }
  header p { margin: 4px 0 0; font-size: 12.5px; color: var(--text-secondary); }
  #controls { display: flex; gap: 10px; align-items: center; padding: 12px 18px 0; flex-wrap: wrap; }
  select, button {
    font: inherit; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--panel-border); background: var(--surface-2);
    color: var(--text-primary);
  }
  button#run { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  #status { font-size: 12.5px; color: var(--text-muted); }
  #status[data-state="error"] { color: var(--error); }
  #status[data-state="ready"], #status[data-state="done"] { color: var(--ok); }
  #query {
    margin: 10px 18px; width: calc(100% - 36px); min-height: 220px; resize: vertical;
    font: 12.5px/1.5 ui-monospace, "SF Mono", Consolas, monospace;
    color: var(--text-primary); background: var(--surface-2);
    border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px;
  }
  #output { flex: 1; overflow: auto; padding: 0 18px 18px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td {
    text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--panel-border);
    font-family: ui-monospace, "SF Mono", Consolas, monospace; word-break: break-all;
  }
  th { color: var(--text-muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: .05em; }
  td[data-termtype="Literal"] { color: var(--text-secondary); }
</style>
</head>
<body>
  <header>
    <h1>Claims Engine — carbon SPARQL workbench</h1>
    <p>Live SPARQL 1.1 over the carbon L0 projection, evaluated by Oxigraph
       compiled to WebAssembly — embedded in this file, no server, no network.</p>
  </header>
  <div id="controls">
    <select id="samples" aria-label="sample queries"></select>
    <button id="run">Run</button>
    <span id="status" data-state="loading">loading…</span>
  </div>
  <textarea id="query" spellcheck="false" aria-label="SPARQL query"></textarea>
  <div id="output"><p id="placeholder" style="color:var(--text-muted)">Results appear here.</p></div>

<script type="module">
/* ---- vendored: oxigraph 0.5.9 web.js (MIT OR Apache-2.0), unmodified ----
   see assets/vendor/oxigraph-0.5.9/README.md for provenance ---- */
__OXIGRAPH_WEB_JS__
/* ---- end vendored code ---- */

const WASM_BASE64 = __WASM_BASE64_JSON__;
const NQUADS = __NQUADS_JSON__;
const SAMPLES = __SAMPLES_JSON__;

const statusEl = document.getElementById("status");
const queryEl = document.getElementById("query");
const samplesEl = document.getElementById("samples");
const outputEl = document.getElementById("output");

function setStatus(state, message) {
  statusEl.dataset.state = state;
  statusEl.textContent = message;
}

for (const [index, sample] of SAMPLES.entries()) {
  const option = document.createElement("option");
  option.value = String(index);
  option.textContent = sample.name;
  samplesEl.appendChild(option);
}
queryEl.value = SAMPLES[0].query;
samplesEl.addEventListener("change", () => {
  queryEl.value = SAMPLES[Number(samplesEl.value)].query;
});

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function termText(term) {
  return term === undefined || term === null ? "" : term.value;
}

function renderSelect(rows) {
  if (!rows.length) {
    outputEl.innerHTML = `<p style="color:var(--text-muted)">No results.</p>`;
    return 0;
  }
  const columns = [...rows[0].keys()];
  let html = `<table id="results"><thead><tr>`;
  for (const column of columns) html += `<th>?${esc(column)}</th>`;
  html += `</tr></thead><tbody>`;
  for (const row of rows) {
    html += `<tr>`;
    for (const column of columns) {
      const term = row.get(column);
      html += `<td data-var="${esc(column)}" data-termtype="${esc(term ? term.termType : "")}">${esc(termText(term))}</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table>`;
  outputEl.innerHTML = html;
  return rows.length;
}

function renderQuads(quads) {
  const rows = quads.map(q => new Map([
    ["subject", q.subject], ["predicate", q.predicate], ["object", q.object],
  ]));
  return renderSelect(rows);
}

function run() {
  setStatus("running", "evaluating…");
  try {
    const result = window.store.query(queryEl.value);
    let count;
    if (typeof result === "boolean") {
      outputEl.innerHTML = `<p><strong>ASK →</strong> ${result}</p>`;
      count = 1;
    } else if (result.length && result[0] instanceof Map || result.length === 0) {
      count = renderSelect(result);
    } else {
      count = renderQuads(result);
    }
    setStatus("done", `${count} result row(s)`);
  } catch (error) {
    outputEl.innerHTML = `<p style="color:var(--error)">${esc(String(error))}</p>`;
    setStatus("error", String(error));
  }
}
document.getElementById("run").addEventListener("click", run);

try {
  setStatus("loading", "instantiating the WebAssembly engine…");
  const bytes = Uint8Array.from(atob(WASM_BASE64), c => c.codePointAt(0));
  await __wbg_init({ module_or_path: bytes.buffer });
  window.store = new Store();
  window.store.load(NQUADS, { format: "application/n-quads" });
  setStatus("ready", `engine ready — ${window.store.size} quads loaded`);
} catch (error) {
  setStatus("error", `engine failed to start: ${error}`);
  throw error;
}
</script>
</body>
</html>
